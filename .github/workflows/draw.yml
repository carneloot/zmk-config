name: 'Draw keyboard'

on:
  push:
    paths:
      - 'config/totem.keymap'
      - 'keymap_drawer.config.yaml'


jobs:
  draw:
    uses: '/caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml'
    permissions:
      contents: write
    with:
      commit_message: '[Draw] ${{ github.event.head_commit.message || "Update keymap drawing" }}'
      amend_commit: false
      output_folder: 'docs/images'
